<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruchi Food Products - Admin</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="app.css">
</head><body><main id="app"></main>
<script>
let token=localStorage.atoken||'',tab='daily',msg='',D={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>+n===0?'—':'₹'+(+n).toLocaleString('en-IN',{maximumFractionDigits:2});
async function api(p,body){const r=await fetch('/api/admin/'+p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined});
 const j=await r.json();if(!r.ok){if(r.status===401&&token){logout()}throw new Error(j.error||'Error')}return j}
function logout(){token='';localStorage.removeItem('atoken');render()}
async function login(){try{const r=await api('login',{password:$('#pw').value});token=r.token;localStorage.atoken=token;msg='';go('daily')}catch(e){msg=e.message;render()}}
async function go(t){tab=t;msg='';try{
 if(t==='daily'){D.daily=await api('daily?date='+(D.date||''))}
 if(t==='monthly'){D.monthly=await api('monthly?month='+(D.month||''))}
 if(t==='products')D.products=await api('products');
 if(t==='shops')D.shops=await api('shops');
 if(t==='settings')D.settings=await api('settings');
 if(t==='dues'){D.dues=await api('dues');D.shops=await api('shops')}
 if(t==='alerts'){D.alerts=await api('notifications');D.unseen=0;await api('notifications/seen',{})}
 }catch(e){msg=e.message}render()}
const names=p=>esc(p.name_en);
function tabs(){return `<div class="tabs">${[['daily','Daily'],['alerts','Alerts'+(D.unseen?` (${D.unseen})`:'')],['dues','Dues'],['monthly','Monthly'],['products','Products'],['shops','Shops'],['settings','Settings']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div>`}
const fmtD=d=>new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function prodText(d){let t=`*Ruchi Food Products – Production list*\nDelivery: ${fmtD(d.date)}\n\n*Total to prepare*\n`;
 t+=d.products.map(p=>`• ${p.name_en}: ${p.qty}`).join('\n')||'No orders';
 t+='\n\n*By shop*\n'+d.shops.map(s=>`${s.name}: ${s.items.map(i=>`${i.name_en} ${i.qty}`).join(', ')}`).join('\n');
 return t}
function waShare(){window.open('https://wa.me/?text='+encodeURIComponent(prodText(D.daily)),'_blank')}
async function copyList(){try{await navigator.clipboard.writeText(prodText(D.daily));msg='Copied ✔'}catch{msg='Could not copy'}render()}
async function markDelivered(shopId,flag){try{await api('delivered',{date:D.daily.date,shop_id:shopId,delivered:flag});go('daily')}catch(e){msg=e.message;render()}}
async function markAll(){try{await api('delivered',{date:D.daily.date,all:true});go('daily')}catch(e){msg=e.message;render()}}
function daily(){const d=D.daily;if(!d)return'';
 return `<div class="printonly"><h2>Production list – ${fmtD(d.date)}</h2></div>
 ${d.off?`<div class="banner">${esc(d.off)} – no production planned for this day</div>`:''}
 <div class="card row noprint"><label>Date <input type="date" value="${d.date}" onchange="D.date=this.value;go('daily')"></label><div class="kpi" style="margin:0"><div><span class="mute">Total</span><b>${inr(d.total)}</b></div></div></div>
 <div class="row noprint" style="justify-content:flex-start;flex-wrap:wrap;margin-bottom:6px"><button class="small" onclick="window.print()">🖨 Print</button><button class="small" onclick="waShare()">WhatsApp</button><button class="ghost small" onclick="copyList()">Copy list</button><button class="ghost small" onclick="markAll()">Mark all delivered</button></div>
 <h2>Total to prepare</h2><div class="card"><table><tr><th>Product</th><th class="n">Qty</th><th class="n">Amount</th></tr>
 ${d.products.map(p=>`<tr><td>${names(p)}</td><td class="n"><b>${p.qty}</b></td><td class="n">${inr(p.amount)}</td></tr>`).join('')||'<tr><td colspan=3 class="mute">No orders yet</td></tr>'}</table></div>
 <h2>By shop</h2>${d.shops.map(s=>`<div class="card"><div class="row"><b>${esc(s.name)}</b><span>${inr(s.amount)}</span></div>
 <div class="mute">${s.items.map(i=>`${esc(i.name_en)} × ${i.qty}`).join(' · ')}</div>
 <div class="noprint row" style="justify-content:flex-start;margin-top:6px"><button class="ghost small" onclick="editOrder(${s.id})">Edit order</button>
 ${s.delivered?`<button class="small" style="background:var(--ok)" onclick="markDelivered(${s.id},false)">Delivered ✔</button>`:`<button class="small" onclick="markDelivered(${s.id},true)">Mark delivered</button>`}</div></div>`).join('')}
 ${d.notOrdered.length&&!d.off?`<h2 class="noprint">Not ordered yet (${d.notOrdered.length})</h2><div class="card mute noprint">${d.notOrdered.map(s=>`${esc(s.name)} (<a href="tel:${esc(s.phone)}">${esc(s.phone)}</a>)`).join(', ')}</div>`:''}`}
async function editOrder(shopId){const d=D.daily,prods=await api('products'),s=d.shops.find(x=>x.id===shopId);
 const cur=Object.fromEntries(s.items.map(i=>[i.product_id,i.qty]));
 const items=[];for(const p of prods.filter(p=>p.active)){const v=prompt(`${s.name} - ${p.name_en} qty`,cur[p.id]||0);if(v===null)return;items.push({product_id:p.id,qty:+v||0})}
 try{await api('order',{shop_id:shopId,date:d.date,items});go('daily')}catch(e){msg=e.message;render()}}
function alerts(){const n=D.alerts;return `<h2>Order alerts</h2><div class="card mute">Shows each time a shop places, changes or cancels an order.</div>
 ${n.items.map(i=>`<div class="card"><div>${esc(i.text)}</div><div class="mute">${new Date(i.ts).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</div></div>`).join('')||'<p class="mute">No alerts yet</p>'}`}
function dues(){const u=D.dues;return `<div class="kpi"><div><span class="mute">Total pending</span><b>${inr(u.totalDue)||'—'}</b></div></div>
 <p class="mute">Only deliveries marked “delivered” on the Daily tab are counted.</p>
 <h2>Shops</h2>${u.shops.map(s=>`<div class="card"><div class="row"><b>${esc(s.name)}</b><b style="color:${s.balance>0?'var(--err)':'var(--ok)'}">${s.balance>0?'Due '+inr(s.balance):s.balance<0?'Advance '+inr(-s.balance):'Settled'}</b></div>
 <div class="mute">Delivered ${inr(s.billed)} · Paid ${inr(s.paid)}${s.unpriced?` · ${s.unpriced} item line(s) have no price yet`:''}</div></div>`).join('')||'<p class="mute">Nothing delivered yet</p>'}
 <h2>Record payment</h2><div class="card grid"><select id="ps">${D.shops.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
 <input id="pa" type="number" step="0.01" placeholder="Amount received ₹"><input id="pd" type="date" value="${new Date(Date.now()+19800000).toISOString().slice(0,10)}"><input id="pn" placeholder="Note (cash / UPI) – optional"><button onclick="addPayment()">Save payment</button></div>
 <h2>Recent payments</h2>${u.payments.map(p=>`<div class="card row"><div><b>${esc(p.shop)}</b> ${inr(p.amount)}<div class="mute">${p.date}${p.note?' · '+esc(p.note):''}</div></div><button class="ghost small" onclick="delPayment(${p.id})">Delete</button></div>`).join('')||'<p class="mute">None</p>'}`}
async function addPayment(){try{await api('payments',{shop_id:$('#ps').value,amount:$('#pa').value,date:$('#pd').value,note:$('#pn').value});go('dues')}catch(e){msg=e.message;render()}}
async function delPayment(id){if(!confirm('Delete this payment?'))return;try{await api('payments/delete',{id});go('dues')}catch(e){msg=e.message;render()}}
function monthly(){const m=D.monthly;if(!m)return'';const mx=Math.max(1,...m.shops.map(s=>s.amount));
 return `<div class="card row"><label>Month <input type="month" value="${m.month}" onchange="D.month=this.value;go('monthly')"></label><button class="ghost small" onclick="exportCsv()">Download CSV</button></div>
 <div class="kpi"><div><span class="mute">Revenue</span><b>${inr(m.total)}</b></div><div><span class="mute">Total qty</span><b>${m.totalQty}</b></div><div><span class="mute">Order days</span><b>${m.orderDays}</b></div><div><span class="mute">Avg / day</span><b>${inr(m.avgPerDay)}</b></div></div>
 <h2>Shops (top first)</h2><div class="card">${m.shops.map(s=>`<div style="margin-bottom:10px"><div class="row"><span>${esc(s.name)}</span><b>${inr(s.amount)}</b></div><div class="bar" style="width:${s.amount/mx*100}%"></div><div class="mute">${s.qty} items · ${s.days} days</div></div>`).join('')||'<span class="mute">No data</span>'}</div>
 <h2>Products</h2><div class="card"><table><tr><th>Product</th><th class="n">Qty</th><th class="n">Amount</th></tr>${m.products.map(p=>`<tr><td>${names(p)}</td><td class="n">${p.qty}</td><td class="n">${inr(p.amount)}</td></tr>`).join('')}</table></div>
 <h2>Day by day</h2><div class="card"><table><tr><th>Date</th><th class="n">Qty</th><th class="n">Amount</th></tr>${m.days.map(d=>`<tr><td>${d.date}</td><td class="n">${d.qty}</td><td class="n">${inr(d.amount)}</td></tr>`).join('')}</table></div>`}
async function exportCsv(){try{const r=await api('export?month='+(D.monthly.month));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+r.csv],{type:'text/csv'}));a.download=r.filename;a.click()}catch(e){msg=e.message;render()}}
function products(){const P=D.products,cats=[...new Set(P.map(p=>p.category).filter(Boolean))];
 return `<datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <div class="row" style="margin:18px 0 8px"><h2 style="margin:0">All products (${P.length})</h2><button class="small" onclick="toggleAdd()">${D.showAdd?'Cancel':'+ Add product'}</button></div>
 ${D.showAdd?`<div class="card grid">
 <input id="pe" placeholder="Product name, e.g. Chappathi (10 pack)"><input id="pc" list="cats" placeholder="Category, e.g. Flatbreads (optional)">
 <input id="pp" type="number" step="0.01" placeholder="Price ₹ (blank = market price)"><input id="pm" placeholder="പേര് (മലയാളം) – optional"><button onclick="addProduct()">Save new product</button></div>`:''}
 ${P.length>6?`<input id="psrch" placeholder="Search products…" oninput="filtP()" style="margin-bottom:8px">`:''}
 ${P.map((p,i)=>`<div class="card grid pcard" data-n="${esc((p.name_en+' '+p.category).toLowerCase())}" style="${p.active?'':'opacity:.6'}">
 <input value="${esc(p.name_en)}" id="e${p.id}"><input value="${esc(p.name_ml)}" id="m${p.id}" placeholder="മലയാളം (optional)">
 <div class="grid grid2"><input list="cats" value="${esc(p.category)}" id="c${p.id}" placeholder="Category"><input type="number" step="0.01" value="${p.price||''}" placeholder="Market price" id="r${p.id}"></div>
 <div class="row"><label><input type="checkbox" id="a${p.id}" ${p.active?'checked':''} style="width:auto"> Active</label>
 <span><button class="ghost small" ${i?'':'disabled'} onclick="moveP(${p.id},'up')">▲</button> <button class="ghost small" ${i<P.length-1?'':'disabled'} onclick="moveP(${p.id},'down')">▼</button> <button class="small" onclick="saveProduct(${p.id})">Save</button></span></div></div>`).join('')}`}
function toggleAdd(){D.showAdd=!D.showAdd;render()}
function filtP(){const v=$('#psrch').value.trim().toLowerCase();document.querySelectorAll('.pcard').forEach(e=>{e.style.display=!v||e.dataset.n.includes(v)?'':'none'})}
async function moveP(id,dir){try{await api('products/move',{id,dir});go('products')}catch(e){msg=e.message;render()}}
async function addProduct(){try{await api('products',{name_en:$('#pe').value,name_ml:$('#pm').value,category:$('#pc').value,price:$('#pp').value});D.showAdd=false;go('products')}catch(e){msg=e.message;render()}}
async function saveProduct(id){try{await api('products',{id,name_en:$('#e'+id).value,name_ml:$('#m'+id).value,category:$('#c'+id).value,price:$('#r'+id).value,active:$('#a'+id).checked?1:0});go('products')}catch(e){msg=e.message;render()}}
function shops(){return `<h2>Add shop</h2><div class="card grid"><input id="sn" placeholder="Shop name"><input id="sp" inputmode="numeric" maxlength="10" placeholder="Phone (10 digits)"><input id="sx" inputmode="numeric" maxlength="6" placeholder="PIN (4-6 digits)"><button onclick="addShop()">Add</button></div>
 <h2>Shops</h2>${D.shops.map(s=>`<div class="card grid"><input value="${esc(s.name)}" id="n${s.id}"><input value="${esc(s.phone)}" id="h${s.id}" maxlength="10">
 <input id="x${s.id}" inputmode="numeric" maxlength="6" placeholder="New PIN (leave blank to keep)"><div class="row"><label><input type="checkbox" id="c${s.id}" ${s.active?'checked':''} style="width:auto"> Active</label><button class="small" onclick="saveShop(${s.id})">Save</button></div></div>`).join('')}`}
async function addShop(){try{await api('shops',{name:$('#sn').value,phone:$('#sp').value,pin:$('#sx').value});go('shops')}catch(e){msg=e.message;render()}}
async function saveShop(id){try{await api('shops',{id,name:$('#n'+id).value,phone:$('#h'+id).value,pin:$('#x'+id).value,active:$('#c'+id).checked?1:0});go('shops')}catch(e){msg=e.message;render()}}
function settings(){const S=D.settings,days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 return `<h2>Order cut-off time</h2><div class="card grid"><p class="mute">Shops order for the next working day. They can place or change orders until this time on the day before (24h, India time).</p><input type="time" id="co" value="${S.cutoff}"><button onclick="saveCutoff()">Save time</button></div>
 <h2>Weekly off days</h2><div class="card grid"><p class="mute">No orders or production on these days.</p><div class="row" style="flex-wrap:wrap;justify-content:flex-start">${days.map((n,i)=>`<label><input type="checkbox" class="wo" value="${i}" ${S.weeklyOff.includes(i)?'checked':''} style="width:auto"> ${n}</label>`).join(' ')}</div><button onclick="saveOff()">Save off days</button></div>
 <h2>Holidays</h2><div class="card grid"><input type="date" id="hd"><input id="hn" placeholder="Reason (e.g. Onam) – optional"><button onclick="addHoliday()">Add holiday</button></div>
 ${S.holidays.map(h=>`<div class="card row"><div><b>${fmtD(h.date)}</b><div class="mute">${esc(h.note)}</div></div><button class="ghost small" onclick="delHoliday('${h.date}')">Remove</button></div>`).join('')}
 <p class="mute">Shops are currently ordering for: <b>${fmtD(S.orderDate)}</b></p>
 <h2>Alerts on this device</h2><div class="card grid"><p class="mute">Get a pop-up when a shop orders while this page is open. For phone alerts when the page is closed, set the NOTIFY_URL option (see README).</p><button onclick="enableAlerts()">Enable browser alerts</button></div>
 <h2>Change admin password</h2><div class="card grid"><input type="password" id="np" placeholder="New password (min 6)"><button onclick="savePw()">Change password</button></div>`}
async function saveOff(){try{await api('settings',{weeklyOff:[...document.querySelectorAll('.wo:checked')].map(x=>+x.value)});msg='Saved ✔';D.settings=await api('settings')}catch(e){msg=e.message}render()}
async function addHoliday(){try{await api('holidays',{date:$('#hd').value,note:$('#hn').value});go('settings')}catch(e){msg=e.message;render()}}
async function delHoliday(date){try{await api('holidays/delete',{date});go('settings')}catch(e){msg=e.message;render()}}
async function enableAlerts(){if(!('Notification' in window)){msg='Not supported on this browser';return render()}msg=(await Notification.requestPermission())==='granted'?'Alerts enabled ✔':'Permission not granted';render()}
async function saveCutoff(){try{await api('settings',{cutoff:$('#co').value});msg='Saved ✔';D.settings=await api('settings')}catch(e){msg=e.message}render()}
async function savePw(){try{await api('password',{password:$('#np').value});msg='Password changed ✔'}catch(e){msg=e.message}render()}
function render(){const a=$('#app');
 if(!token){a.innerHTML=`<header><h1>🫓 Ruchi Food Products</h1></header><div class="card grid"><label>Admin password<input id="pw" type="password"></label><button onclick="login()">Login</button></div>${msg?`<div class="msg err">${esc(msg)}</div>`:''}`;return}
 a.innerHTML=`<header><h1>🫓 Ruchi Food Products</h1><button class="ghost small" onclick="logout()">Logout</button></header>${tabs()}${msg?`<div class="msg ${/✔/.test(msg)?'ok':'err'}">${esc(msg)}</div>`:''}${({daily,alerts,dues,monthly,products,shops,settings})[tab]()}`}
async function poll(){if(!token)return;try{const n=await api('notifications');
 if(n.unseen>(D.unseen||0)&&tab!=='alerts'){const latest=n.items.find(i=>!i.seen);if(latest&&'Notification' in window&&Notification.permission==='granted')new Notification('Ruchi Food Products',{body:latest.text});D.unseen=n.unseen;render()}
 else if(tab==='alerts'&&n.unseen){D.alerts=await api('notifications');await api('notifications/seen',{});render()}
 document.title=(n.unseen&&tab!=='alerts'?`(${n.unseen}) `:'')+'Ruchi Food Products - Admin'}catch{}}
setInterval(poll,30000);
if(token){go('daily');poll()}else render();
</script></body></html>
